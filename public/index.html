<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元素岛：反应工坊 · 网页版</title>
<style>
  :root{
    --paper:#F7F3EA; --card:#FFFDF8; --ink:#1F2937; --muted:#64748B;
    --teal:#0F6E6E; --teal-d:#0B4E4E; --teal-l:#E5F1EF;
    --orange:#D97706; --orange-l:#FDF1DF; --line:#E2E0D6; --red:#B91C1C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  sub,sup{font-size:.72em}
  #app{display:flex;flex-direction:column;min-height:100vh}

  /* ---------- start screen ---------- */
  .start-panel{
    max-width:560px;margin:7vh auto;background:var(--card);border:1px solid var(--line);
    border-radius:22px;padding:34px 36px;box-shadow:0 18px 50px rgba(15,70,70,.08);
  }
  .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--orange);font-weight:700}
  .start-title{font-size:40px;margin:10px 0 6px;color:var(--teal-d);letter-spacing:.02em}
  .start-sub{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 18px}
  .label{font-size:12px;color:var(--muted);margin:14px 0 8px;font-weight:700;letter-spacing:.08em}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .segbtn{
    border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;
    padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  .segbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .start-players{display:flex;flex-direction:column;gap:8px}
  .prow{display:flex;align-items:center;gap:10px}
  .prow .dot{width:14px;height:14px;border-radius:50%}
  .nameinput{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;
    font-family:inherit;background:#fff;color:var(--ink);
  }
  .tag{font-size:11px;color:var(--muted);width:32px}
  .hint{font-size:13px;color:var(--muted);line-height:1.65}
  .start-foot{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.7}
  .start-foot a{color:var(--teal)}
  button.primary{
    background:var(--teal);color:#fff;border:none;border-radius:12px;padding:10px 18px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  button.primary:hover{background:var(--teal-d)}
  button.primary.big{width:100%;margin-top:18px;padding:14px;font-size:16px}
  button.ghost{
    background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;
    padding:6px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;
  }
  button.ghost:hover{background:#fff}
  button.ghost.wide{display:block;width:100%;margin-top:8px;padding:9px}
  button.ghost.small{padding:4px 8px;font-size:12px}
  button.disabled{opacity:.45;cursor:not-allowed}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:18px;padding:10px 20px;background:var(--teal-d);color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.12);z-index:5;
  }
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brandmark{font-size:19px;font-weight:800;letter-spacing:.04em}
  .brandsub{font-size:10.5px;opacity:.7;letter-spacing:.08em}
  .status{flex:1;font-size:14px}
  .status b{font-weight:800}
  .who{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:800}
  .who i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
  .topright{display:flex;align-items:center;gap:10px}
  .topright .ghost{border-color:rgba(255,255,255,.35);color:#fff}
  .topright .ghost:hover{background:rgba(255,255,255,.12)}
  .dicebox{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:5px 9px;border-radius:10px}
  .die{width:22px;height:22px;background:#fff;border-radius:5px;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;gap:1px}
  .die i{border-radius:50%;background:transparent}
  .die i.on{background:#1F2937}
  .sum{font-weight:800;font-size:15px;margin-left:4px}

  /* ---------- layout ---------- */
  .main{
    display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px;
    padding:14px 16px 20px;align-items:start;
  }
  .boardwrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px;
    box-shadow:0 10px 30px rgba(15,70,70,.06)}
  svg.board{width:100%;height:calc(100vh - 120px);display:block}
  .side{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 96px);overflow:auto;padding-right:2px}
  .side::-webkit-scrollbar{width:6px}
  .side::-webkit-scrollbar-thumb{background:#D6D3C8;border-radius:3px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;
    box-shadow:0 6px 18px rgba(15,70,70,.05)}
  .cardhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:12px;
    color:var(--muted);font-weight:700;letter-spacing:.06em}
  .muted{color:var(--muted)}
  .small{font-size:11.5px}

  .action .pname{font-size:17px;font-weight:800}
  .action .vp{font-size:12px;color:var(--muted)}
  .action .vp b{font-size:17px;color:var(--teal-d)}
  .actgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .actbtn{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 8px;font-size:14px;
    font-weight:700;color:var(--teal-d);cursor:pointer;font-family:inherit;
  }
  .actbtn:hover{border-color:var(--teal);background:var(--teal-l)}
  .actbtn.dim{opacity:.45}
  .actbtn .mini{font-size:11px;color:var(--muted);font-weight:400}
  .turnmeta{font-size:11.5px;color:var(--muted);margin:2px 0 10px}
  button.primary.wide{width:100%}

  /* ---------- market ---------- */
  .market{display:flex;flex-direction:column;gap:8px}
  .gcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 9px;cursor:pointer}
  .gcard:hover{border-color:var(--teal)}
  .gcard.ready{border-color:var(--teal);background:var(--teal-l)}
  .gcard.empty{color:var(--muted);font-size:12px;text-align:center;padding:14px}
  .grow{display:flex;justify-content:space-between;align-items:center}
  .gid{font-weight:800;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .gvp{font-weight:800;color:var(--orange);font-size:13px}
  .geq{font-size:13.5px;margin:3px 0;line-height:1.45;color:var(--ink)}
  .gmeta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .tag{font-size:10.5px;background:var(--teal-l);color:var(--teal);padding:1px 6px;border-radius:6px;white-space:nowrap;flex:none}
  .cond{font-size:10.5px;color:var(--muted);margin-left:2px}
  .gpay{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .chip{font-size:11px;border-radius:6px;padding:1px 6px;background:#F1EFE7;color:var(--ink)}
  .chip.ok{background:#DFF3E5;color:#166534}
  .chip.no{background:#FDE8E8;color:#991B1B}

  /* ---------- players ---------- */
  .prow2{display:flex;align-items:center;gap:8px;margin-top:6px}
  .prow2.cur{background:var(--teal-l);border-radius:8px;padding:3px 6px;margin-left:-6px}
  .prow2 .dot{width:11px;height:11px;border-radius:50%}
  .prow2 .pn{flex:1;font-size:13px;font-weight:600}
  .prow2 .pv b{font-size:14px;color:var(--teal-d)}
  .pdetail{display:block;font-size:10px;color:var(--muted);text-align:right;margin-top:-2px}
  .tokens{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0 2px 19px}
  .tok{font-size:11px;color:#fff;border-radius:6px;padding:1px 6px;font-weight:700}
  .prods{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 2px 19px}
  .prodchip{font-size:11px;background:#EEF2FF;color:#3730A3;border-radius:6px;padding:1px 6px;cursor:pointer}
  .prodchip:hover{background:#E0E7FF}
  .goalsline{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 2px 19px}
  .goaltag{font-size:10.5px;background:var(--orange-l);color:#92400E;border-radius:5px;padding:1px 5px}

  /* ---------- log ---------- */
  .logcard{max-height:280px;display:flex;flex-direction:column}
  .log{overflow:auto;font-size:12px;line-height:1.7}
  .lrow{border-bottom:1px dashed #EEEAE0;padding:2px 0;color:#475569}
  .lrow.ok{color:#166534}
  .lrow.warn{color:#B45309}
  .lrow.goal{color:var(--teal);font-weight:700}
  .lrow.win{color:var(--red);font-weight:800}
  .lrow.dice{color:var(--ink);font-weight:700}
  .lrow.chem{color:#3730A3}
  .lrow.turn{color:var(--muted);font-style:italic}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,40,40,.42);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:20}
  .modal{background:var(--card);border-radius:18px;width:min(520px,94vw);max-height:86vh;display:flex;
    flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}
  .modal.wide{width:min(760px,94vw)}
  .modalhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px}
  .modalhead h2{margin:0;font-size:17px;color:var(--teal-d)}
  .modalhead .x{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1}
  .modalbody{padding:6px 20px 20px;overflow:auto}
  .modal-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

  .sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .scard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;cursor:default;opacity:.55}
  .scard.can{opacity:1;cursor:pointer}
  .scard.can:hover{border-color:var(--teal);background:var(--teal-l)}
  .scard .sid{font-size:10px;color:var(--muted);font-weight:700}
  .scard .sform{font-size:15px;margin:2px 0 4px}
  .scard .sname{font-size:11px;color:var(--muted)}
  .scost{display:flex;gap:4px;flex-wrap:wrap}

  .trow{display:flex;align-items:center;gap:10px;margin:10px 0}
  .sel{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:13px;background:#fff}
  .portsrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chipbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;
    cursor:pointer;font-family:inherit}
  .chipbtn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .tradecol{margin:8px 0}

  .buildgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .bcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;cursor:pointer}
  .bcard:hover{border-color:var(--teal);background:var(--teal-l)}
  .btitle{font-weight:800;font-size:15px;color:var(--teal-d)}
  .bcost{margin:8px 0;display:flex;gap:4px;flex-wrap:wrap}
  .bdesc{font-size:11.5px;color:var(--muted)}

  .floatbar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);
    border-radius:14px;padding:10px 14px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:30;font-size:13px}

  .goalrow{display:flex;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
  .goalrow.can{border-color:var(--teal);background:var(--teal-l);cursor:pointer}
  .detail-eq{font-size:22px;color:var(--teal-d);margin:6px 0 8px}
  .payline{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:12px}
  .teaching{font-size:13px;line-height:1.7;color:#334155;background:var(--teal-l);border-radius:10px;padding:10px 12px}

  .scorelist{display:flex;flex-direction:column;gap:8px;margin:10px 0}
  .scorerow{display:grid;grid-template-columns:14px 70px 60px 1fr;gap:8px;align-items:center;font-size:13px;
    border-bottom:1px dashed #EEEAE0;padding:6px 0}
  .scorerow .dot{width:12px;height:12px;border-radius:50%}
  .scorerow .svp b{font-size:16px;color:var(--teal-d)}
  .scorerow .sdetail{font-size:11.5px;color:var(--muted)}
  .chain{margin-top:8px}
  .chainrow{font-size:12px;color:#334155;padding:3px 0;border-bottom:1px dashed #EEEAE0}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:#1F2937;color:#fff;
    padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


  /* ---------- 掷骰全屏动画 ---------- */
  .dfx{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:radial-gradient(circle at 50% 38%, rgba(15,23,42,.95), rgba(2,6,23,.99));
    animation:dfxFade .16s ease-out;backdrop-filter:blur(3px)}
  /* 颜色层：掷骰时是中性深色，落定后慢慢过渡到蓝（正常）或红（污染） */
  .dfx::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;
    transition:opacity 1.6s ease;
    background:radial-gradient(circle at 50% 38%, rgba(37,99,235,.55), rgba(8,20,45,.95))}
  .dfx.calm::before{opacity:1}
  .dfx.danger::before{opacity:1;
    background:radial-gradient(circle at 50% 38%, rgba(190,24,24,.58), rgba(45,8,8,.96))}
  .dfx.instant::before{transition:none}
  .dfx-inner{position:relative;z-index:1}
  .dfx.out{animation:dfxFadeOut .26s ease-in forwards}
  .dfx-inner{text-align:center;color:#fff;transform:translateY(-1.5vh);padding:20px}
  .dfx-who{font-size:15px;letter-spacing:.18em;opacity:.75;margin-bottom:20px}
  .dfx-dice{display:flex;gap:30px;justify-content:center}
  .dfx-die{width:120px;height:120px;background:#fff;border-radius:22px;display:grid;
    grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:15px;gap:6px;
    box-shadow:0 20px 46px rgba(0,0,0,.42);animation:dfxShake .22s linear infinite}
  .dfx.landed .dfx-die{animation:dfxLand .45s cubic-bezier(.2,1.4,.4,1) both}
  .dfx-die i{border-radius:50%;background:transparent}
  .dfx-die i.on{background:#1F2937;box-shadow:inset 0 -1px 2px rgba(0,0,0,.25)}
  .dfx-label{margin-top:22px;font-size:13px;letter-spacing:.32em;opacity:0;text-transform:uppercase}
  .dfx.landed .dfx-label{animation:dfxFade .4s ease-out .08s both}
  .dfx-sumwrap{margin-top:2px;display:flex;align-items:flex-end;justify-content:center;gap:12px;opacity:0}
  .dfx.landed .dfx-sumwrap{animation:dfxPop .5s cubic-bezier(.2,1.5,.4,1) .1s both}
  .dfx-sum{font-size:104px;font-weight:800;line-height:1;letter-spacing:-.02em;
    text-shadow:0 8px 30px rgba(0,0,0,.4);transition:color 1.2s ease}
  .dfx.calm .dfx-sum{color:#BFDBFE}
  .dfx.danger .dfx-sum{color:#FCA5A5}
  .dfx.calm .dfx-note{color:#DBEAFE}
  .dfx-unit{font-size:24px;opacity:.7;margin-bottom:16px}
  .dfx-note{margin-top:12px;font-size:14.5px;opacity:0;letter-spacing:.02em}
  .dfx.landed .dfx-note{animation:dfxFade .4s ease-out .32s both}
  .dfx-hint{margin-top:26px;font-size:12px;opacity:0}
  .dfx.landed .dfx-hint{animation:dfxFade .4s ease-out .9s both}
  @keyframes dfxFade{from{opacity:0}to{opacity:1}}
  @keyframes dfxFadeOut{from{opacity:1}to{opacity:0}}
  @keyframes dfxShake{0%{transform:rotate(-13deg) translateY(0)}25%{transform:rotate(9deg) translateY(-9px)}
    50%{transform:rotate(-7deg) translateY(7px)}75%{transform:rotate(11deg) translateY(-5px)}
    100%{transform:rotate(0) translateY(0)}}
  @keyframes dfxLand{0%{transform:scale(1.32);opacity:.2}60%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
  @keyframes dfxPop{0%{transform:scale(.35);opacity:0}70%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
  @media (max-width:640px){
    .dfx-die{width:92px;height:92px;padding:11px;border-radius:16px}
    .dfx-dice{gap:20px}
    .dfx-sum{font-size:76px}
    .dfx-note{font-size:12.5px;padding:0 10px}
  }
  .refsec{margin:10px 0 18px}
  .refchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .refgoaltag{font-size:12px;background:var(--orange-l);color:#92400E;border-radius:7px;padding:3px 8px}
  .reflist{display:flex;flex-direction:column;gap:4px;margin:6px 0 18px}
  .refrow{display:grid;grid-template-columns:44px 1fr 34px auto;gap:8px;align-items:center;
    font-size:12.5px;border-bottom:1px dashed #EEEAE0;padding:5px 0}
  .refid{font-weight:800;color:var(--muted);font-size:11px;letter-spacing:.03em}
  .refeq{color:var(--ink)}
  .refvp{color:var(--orange);font-weight:800;text-align:right}
  .refneed{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .lobbysec{margin:10px 0}
  .lobbysec .lbl{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin:0 0 6px}
  .lobbysec .nameinput,.lobbysec .sel{width:100%}
  .roomlink{display:flex;gap:8px;align-items:center;margin:12px 0}
  .roomlink .nameinput{flex:1;font-size:12px;min-width:0}
  .roomplayers{display:flex;flex-direction:column;gap:8px;margin:16px 0}
  .rrow{display:flex;align-items:center;gap:9px;font-size:14px;border:1px solid var(--line);
    border-radius:11px;padding:9px 12px;background:#fff}
  .rrow .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .rrow .rname{flex:1}
  .waiting{font-size:13px;color:var(--muted);background:var(--teal-l);border-radius:10px;padding:10px 12px}
  .roomchip b{color:#FDE68A;letter-spacing:.08em}
  .hex.dim polygon{opacity:.32}
  .hex.dim text{opacity:.35}
  .hex.flash polygon{animation:hexPulse 1.05s ease-in-out infinite}
  .flashring{fill:none;stroke:#F59E0B;stroke-width:.12;animation:ringPulse 1.05s ease-in-out infinite;pointer-events:none}
  @keyframes hexPulse{0%,100%{stroke-width:.05}50%{stroke-width:.1}}
  @keyframes ringPulse{0%,100%{opacity:.4;stroke-width:.1}50%{opacity:1;stroke-width:.18}}
  .hl{animation:hlpulse 1.8s ease-in-out infinite}
  .hl:hover{opacity:1 !important;filter:brightness(1.06)}
  @keyframes hlpulse{0%,100%{opacity:.55}50%{opacity:1}}
  button.ghost.demo{display:block;width:100%;margin-top:10px;padding:10px}
  .selftest{position:fixed;right:14px;bottom:14px;background:#fff;border:1px solid #E2E0D6;border-radius:10px;
    padding:10px 14px;font-size:11.5px;line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:60}


  @media (max-width:640px){
    .start-panel{margin:12px;padding:20px 18px;border-radius:16px}
    .start-title{font-size:30px}
    .start-sub{font-size:13px}
    .main{padding:8px;gap:8px}
    .topbar{flex-wrap:wrap;gap:8px;padding:8px 12px}
    .topbar .status{order:3;width:100%;font-size:13px}
    .boardwrap{padding:2px;border-radius:12px}
    svg.board{height:auto;max-height:64vh}
    .side{max-height:none}
    .card{padding:10px 12px}
    .sgrid{grid-template-columns:1fr}
    .buildgrid{grid-template-columns:1fr}
    .modal{width:96vw}
    .modal.wide{width:96vw}
    .floatbar{left:8px;right:8px;transform:none;justify-content:center}
    .scorerow{grid-template-columns:12px 56px 52px 1fr}
  }

  @media (max-width:1080px){
    .main{grid-template-columns:1fr}
    svg.board{height:auto;max-height:70vh}
    .side{max-height:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<footer style="text-align:center;font-size:11.5px;color:#94A3B8;padding:0 0 18px">

</footer>
